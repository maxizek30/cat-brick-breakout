<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas
      id="game"
      width="640"
      height="480"
      style="background: #000; border: 2px solid #08d9d6"
    ></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const ball = {
        x: 320,
        y: 240,
        radius: 10,
        dx: 1,
        dy: 1,
      };
      const paddle = {
        x: 270,
        y: 450,
        width: 100,
        height: 12,
        speed: 3,
      };
      const BRICK = {
        rows: 5,
        cols: 9,
        width: 58,
        height: 20,
        padding: 6,
        offsetTop: 50,
        offsetLeft: 25,
      };
      let bricks = [];

      function buildBricks() {
        for (let r = 0; r < BRICK.rows; r++) {
          bricks[r] = [];
          for (let c = 0; c < BRICK.cols; c++) {
            const x = c * (BRICK.width + BRICK.padding) + BRICK.offsetLeft;
            const y = r * (BRICK.height + BRICK.padding) + BRICK.offsetTop;
            bricks[r][c] = { x, y, alive: true };
          }
        }
      }

      buildBricks();

      const keys = { left: false, right: false };

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") keys.left = true;
        if (e.key === "ArrowRight") keys.right = true;
      });

      document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft") keys.left = false;
        if (e.key === "ArrowRight") keys.right = false;
      });

      function update() {
        if (keys.left) paddle.x -= paddle.speed;
        if (keys.right) paddle.x += paddle.speed;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
          ball.dx = -ball.dx;
        }
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
          ball.dy = -ball.dy;
        }
        if (
          ball.x + ball.radius > paddle.x &&
          ball.x - ball.radius < paddle.x + paddle.width &&
          ball.y + ball.radius > paddle.y &&
          ball.y - ball.radius < paddle.y + paddle.height &&
          ball.dy > 0
        ) {
          ball.dy = -ball.dy;
        }
        for (let r = 0; r < BRICK.rows; r++) {
          for (let c = 0; c < BRICK.cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue; // can't collide with a dead brick

            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + BRICK.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + BRICK.height
            ) {
              ball.dy = -ball.dy; // bounce
              b.alive = false; // destroy the brick
            }
          }
        }
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();

        ctx.fillStyle = "#ff2e63";
        for (let r = 0; r < BRICK.rows; r++) {
          for (let c = 0; c < BRICK.cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue; // skip destroyed bricks
            ctx.fillRect(b.x, b.y, BRICK.width, BRICK.height);
          }
        }
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "red";
        ctx.fillStyle = "#08d9d6";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fill();
      }
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
