<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas
      id="game"
      width="640"
      height="480"
      style="background: #000; border: 2px solid #08d9d6"
    ></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const ball = {
        x: 320,
        y: 240,
        radius: 10,
        dx: 3,
        dy: 3,
      };
      const paddle = {
        x: 270,
        y: 450,
        width: 100,
        height: 12,
        speed: 3,
      };
      const BRICK = {
        rows: 5,
        cols: 9,
        width: 58,
        height: 20,
        padding: 6,
        offsetTop: 50,
        offsetLeft: 25,
      };
      let bricks = [];

      let gameState = "ready"; // "ready" | "playing" | "gameover" | "won"
      let lives = 3;

      function buildBricks() {
        for (let r = 0; r < BRICK.rows; r++) {
          bricks[r] = [];
          for (let c = 0; c < BRICK.cols; c++) {
            const x = c * (BRICK.width + BRICK.padding) + BRICK.offsetLeft;
            const y = r * (BRICK.height + BRICK.padding) + BRICK.offsetTop;
            bricks[r][c] = { x, y, alive: true };
          }
        }
      }

      buildBricks();

      const keys = { left: false, right: false };

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") keys.left = true;
        if (e.key === "ArrowRight") keys.right = true;
        if (e.key === " " && gameState === "ready") {
          ball.dx = 3;
          ball.dy = -3;
          gameState = "playing";
        }
        if (
          (e.key === "r" || e.key === "R") &&
          (gameState === "gameover" || gameState === "won")
        ) {
          // restart
          lives = 3;
          buildBricks();
          resetBall();
          gameState = "ready";
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft") keys.left = false;
        if (e.key === "ArrowRight") keys.right = false;
      });

      function resetBall() {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
        ball.dx = 0;
        ball.dy = 0;
      }

      function update() {
        if (gameState === "gameover" || gameState === "won") return;

        if (keys.left) paddle.x -= paddle.speed;
        if (keys.right) paddle.x += paddle.speed;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

        if (gameState === "ready") {
          ball.x = paddle.x + paddle.width / 2;
          return; // no physics until launched
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
          ball.dx = -ball.dx;
        }
        if (ball.y - ball.radius < 0) {
          ball.dy = -ball.dy;
        }
        if (ball.y - ball.radius > canvas.height) {
          lives -= 1;
          if (lives <= 0) {
            gameState = "gameover";
          } else {
            resetBall();
            gameState = "ready";
          }
        }

        if (
          ball.x + ball.radius > paddle.x &&
          ball.x - ball.radius < paddle.x + paddle.width &&
          ball.y + ball.radius > paddle.y &&
          ball.y - ball.radius < paddle.y + paddle.height &&
          ball.dy > 0
        ) {
          // inside paddle collision check, replacing `ball.dy = -ball.dy;`
          const hitPos =
            (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          // hitPos is now -1 (far left) to +1 (far right), 0 = center

          const maxAngle = Math.PI / 3; // 60 degrees from straight up
          const angle = hitPos * maxAngle;

          const speed = Math.hypot(ball.dx, ball.dy);
          ball.dx = speed * Math.sin(angle);
          ball.dy = -speed * Math.cos(angle);
        }
        for (let r = 0; r < BRICK.rows; r++) {
          for (let c = 0; c < BRICK.cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue;

            // AABB overlap check (same as before)
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + BRICK.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + BRICK.height
            ) {
              // Find the brick's center
              const brickCenterX = b.x + BRICK.width / 2;
              const brickCenterY = b.y + BRICK.height / 2;

              // Distance from ball center to brick center
              const dx = ball.x - brickCenterX;
              const dy = ball.y - brickCenterY;

              // Overlap on each axis (positive = how deep they're interpenetrating)
              const overlapX = BRICK.width / 2 + ball.radius - Math.abs(dx);
              const overlapY = BRICK.height / 2 + ball.radius - Math.abs(dy);

              // The smaller overlap is the axis we just crossed → reflect on that one
              if (overlapX < overlapY) {
                ball.dx = -ball.dx;
              } else {
                ball.dy = -ball.dy;
              }

              b.alive = false;
              break; // stop checking bricks this frame to avoid double-bounces
            }
          }
        }
        if (bricks.flat().every((b) => !b.alive)) {
          gameState = "won";
        }
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // bricks
        ctx.fillStyle = "#ff2e63";
        for (let r = 0; r < BRICK.rows; r++) {
          for (let c = 0; c < BRICK.cols; c++) {
            const b = bricks[r][c];
            if (!b.alive) continue;
            ctx.fillRect(b.x, b.y, BRICK.width, BRICK.height);
          }
        }

        // paddle
        ctx.fillStyle = "#08d9d6";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

        // ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#eaeaea";
        ctx.fill();

        // HUD
        ctx.fillStyle = "#eaeaea";
        ctx.font = "16px monospace";
        ctx.textAlign = "left";
        ctx.fillText(`Lives: ${lives}`, 10, 24);

        // state overlays
        ctx.textAlign = "center";
        if (gameState === "ready") {
          ctx.font = "20px monospace";
          ctx.fillText(
            "Press SPACE to launch",
            canvas.width / 2,
            canvas.height / 2,
          );
        } else if (gameState === "gameover") {
          ctx.font = "32px monospace";
          ctx.fillStyle = "#ff2e63";
          ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
          ctx.font = "16px monospace";
          ctx.fillStyle = "#eaeaea";
          ctx.fillText(
            "Press R to restart",
            canvas.width / 2,
            canvas.height / 2 + 30,
          );
        } else if (gameState === "won") {
          ctx.font = "32px monospace";
          ctx.fillStyle = "#08d9d6";
          ctx.fillText("YOU WIN!", canvas.width / 2, canvas.height / 2);
          ctx.font = "16px monospace";
          ctx.fillStyle = "#eaeaea";
          ctx.fillText(
            "Press R to play again",
            canvas.width / 2,
            canvas.height / 2 + 30,
          );
        }
      }
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
